<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleships</title>
    <link rel="icon" href="assets/icons/sitelogo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <img src="assets/icons/battleship.svg" alt="Battleship Icon" />
      <span class="title">Battleship</span>
    </header>
    <main>
      <div class="game-wrapper">
        <div class="container">
          <div class="first-grid-container">
            <span class="first-grid-span">Your Grid</span>
            <div class="first-grid"></div>
          </div>
          <div class="second-grid-container">
            <span class="second-grid-span">Enemy Grid</span>
            <div class="second-grid"></div>
          </div>
        </div>
        <span class="battle-log">Your Turn</span>
      </div>
      <form action="#" class="player-form">
        <button type="submit" class="start-btn">Start Game</button>
      </form>
    </main>
  </body>
</html>
